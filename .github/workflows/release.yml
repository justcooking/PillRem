name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage Release Artifact
        run: |
          mkdir -p artifacts
          # Use tag name or fallback to commit sha for workflow_dispatch
          VERSION="${GITHUB_REF_NAME:-latest}"
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" "artifacts/PillRem-${VERSION}.apk"
            echo "Artifact staged: artifacts/PillRem-${VERSION}.apk"
          else
            echo "Error: Release APK not found!"
            exit 1
          fi

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
